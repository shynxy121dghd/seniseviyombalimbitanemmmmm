<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Seni Seviyorum</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Consolas,monospace;
}

#terminal{
    position:fixed;
    inset:0;
    overflow:hidden;
    padding:12px;
}

.line{
    white-space:nowrap;
    font-size:18px;
    line-height:1.35;
    font-weight:bold;
    text-shadow:0 0 8px currentColor;
    animation:fade .15s linear;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>

const terminal=document.getElementById("terminal");

let number=18132000;

function randomColor(){
    return `hsl(${Math.random()*360},100%,65%)`;
}

function addLine(){

    const div=document.createElement("div");

    div.className="line";

    div.style.color=randomColor();

    div.textContent=`${number}   -   Seni seviyorum`;

    terminal.appendChild(div);

    number++;

    terminal.scrollTop=terminal.scrollHeight;

    if(terminal.children.length>350){
        terminal.removeChild(terminal.firstChild);
    }

}

function loop(){

    for(let i=0;i<3;i++){
        addLine();
    }

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
